<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .quiz-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        .quiz-title {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 25px;
        }
        .question-block {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 10px;
        }
        .options-list {
            list-style: none;
            padding: 0;
        }
        .options-list li {
            margin: 8px 0;
        }
        .options-list label {
            display: block;
            padding: 10px 15px;
            background: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .options-list label:hover {
            background: #e8f0fe;
        }
        .options-list input[type="radio"] {
            margin-right: 10px;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background: #1557b0;
        }
        .result-box {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background: #e6f4ea;
            color: #137333;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2 class="quiz-title">Kuis Interaktif Murid</h2>
    <form id="quizForm">
        
        <!-- Soal 1 -->
        <div class="question-block">
            <p class="question-text">1. Planet manakah yang dikenal sebagai Planet Merah?</p>
            <ul class="options-list">
                <li><label><input type="radio" name="q1" value="A"> A. Venus</label></li>
                <li><label><input type="radio" name="q1" value="B"> B. Mars</label></li>
                <li><label><input type="radio" name="q1" value="C"> C. Jupiter</label></li>
                <li><label><input type="radio" name="q1" value="D"> D. Saturnus</label></li>
            </ul>
        </div>

        <!-- Soal 2 -->
        <div class="question-block">
            <p class="question-text">2. Apa lambang kimia untuk unsur air?</p>
            <ul class="options-list">
                <li><label><input type="radio" name="q2" value="A"> A. CO2</label></li>
                <li><label><input type="radio" name="q2" value="B"> B. O2</label></li>
                <li><label><input type="radio" name="q2" value="C"> C. H2O</label></li>
                <li><label><input type="radio" name="q2" value="D"> D. NaCl</label></li>
            </ul>
        </div>

        <!-- Soal 3 -->
        <div class="question-block">
            <p class="question-text">3. Siapakah pencipta lagu kebangsaan Indonesia Raya?</p>
            <ul class="options-list">
                <li><label><input type="radio" name="q3" value="A"> A. Ibu Soed</label></li>
                <li><label><input type="radio" name="q3" value="B"> B. W.R. Supratman</label></li>
                <li><label><input type="radio" name="q3" value="C"> C. Ismail Marzuki</label></li>
                <li><label><input type="radio" name="q3" value="D"> D. Kusbini</label></li>
            </ul>
        </div>

        <button type="button" class="submit-btn" onclick="checkAnswers()">Kirim Jawaban</button>
    </form>

    <div id="result" class="result-box"></div>
</div>

<script>
function checkAnswers() {
    // Kunci Jawaban Resmi
    const answers = {
        q1: "B",
        q2: "C",
        q3: "B"
    };
    
    let score = 0;
    let totalQuestions = Object.keys(answers).length;
    const form = document.getElementById('quizForm');
    
    // Hitung Nilai
    for (let key in answers) {
        const selected = form.elements[key].value;
        if (selected === answers[key]) {
            score++;
        }
    }
    
    // Hitung persentase nilai (skala 100)
    let finalScore = Math.round((score / totalQuestions) * 100);
    
    // Tampilkan Hasil
    const resultBox = document.getElementById('result');
    resultBox.innerHTML = `Kuis Selesai!<br>Skor Kamu: ${finalScore} / 100<br>(Benar ${score} dari ${totalQuestions} soal)`;
    resultBox.style.display = 'block';
    
    // Otomatis scroll ke hasil
    resultBox.scrollIntoView({ behavior: 'smooth' });
}
</script>

</body>
</html>
